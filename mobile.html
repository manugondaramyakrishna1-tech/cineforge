<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CineForge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f4f6fb;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:22px}header{padding:10px 0 18px}h1{margin:0;color:#a9c8ff}p{color:#bac3d3}.card{background:#1c2230;border:1px solid #30384a;border-radius:18px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 6px;font-weight:600}input,textarea,select{width:100%;border-radius:10px;border:1px solid #39445a;background:#111723;color:white;padding:12px;font-size:16px}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:12px;padding:14px;width:100%;background:#5688ff;color:#081126;font-weight:700;font-size:16px;margin-top:14px}button:disabled{opacity:.45}.pill{display:inline-block;padding:7px 11px;border-radius:30px;background:#28354d;color:#c7ddff}video{width:100%;border-radius:12px;margin-top:12px}small{color:#aab5c8}progress{width:100%;height:16px}#status{white-space:pre-wrap;color:#d7e3f7}.hint{color:#ffd18c;white-space:pre-wrap;margin-top:8px}
</style></head><body><main><header><h1>🎬 CineForge</h1><p>Prompt-to-video studio</p></header>
<section class="card"><div id="gpu" class="pill">Checking runtime…</div><div id="hint" class="hint"></div><button id="refresh" type="button">Refresh GPU status</button>
<label for="base">API server URL</label><input id="base" placeholder="https://your-api-host">
<label for="prompt">Describe your video</label><textarea id="prompt" maxlength="2000" placeholder="A cinematic aerial view of a futuristic city at sunrise…"></textarea>
<label>Frames</label><select id="frames"><option>17</option><option selected>25</option><option>33</option><option>49</option></select>
<label>Inference steps</label><select id="steps"><option>15</option><option selected>25</option><option>35</option></select>
<button id="go" disabled>Generate video</button></section>
<section class="card"><div id="status">Ready.</div><progress id="progress" value="0" max="100" hidden></progress><video id="video" controls playsinline hidden></video><a id="download" hidden download="cineforge.mp4">Download MP4</a></section>
<small>Generation runs on the API server and requires a CUDA-enabled host.</small><section class="card"><h2>Saved job history</h2><button id="historyRefresh" type="button">Refresh history</button><div id="history">Loading history…</div></section></main>
<script>
const base=document.getElementById('base'),gpu=document.getElementById('gpu'),hint=document.getElementById('hint'),statusEl=document.getElementById('status'),btn=document.getElementById('go'),progress=document.getElementById('progress'),video=document.getElementById('video'),download=document.getElementById('download');
base.value=location.origin.startsWith('http')?location.origin:'';
function url(path){return base.value.trim().replace(/\/$/,'')+path}
async function check(){gpu.textContent='Checking…';btn.disabled=true;hint.textContent='';try{const r=await fetch(url('/health'));if(!r.ok)throw new Error('Health endpoint returned '+r.status);const d=await r.json();if(d.cuda_available){gpu.textContent='GPU ready: '+d.gpu;gpu.style.color='#9dffbe';hint.textContent='CUDA '+d.cuda_build+' · '+d.device_count+' device(s)';btn.disabled=false}else{gpu.textContent='GPU unavailable';gpu.style.color='#ffd18c';hint.textContent=d.runtime_hint||'No GPU detected.';if(d.nvidia_smi)hint.textContent+='\nDiagnostic: '+(d.nvidia_smi.output||'nvidia-smi unavailable')} }catch(e){gpu.textContent='API not connected';hint.textContent=e.message;btn.disabled=true}}
document.getElementById('refresh').onclick=check;base.addEventListener('change',check);check();
async function loadHistory(){const box=document.getElementById('history');box.textContent='Loading…';try{const r=await fetch(url('/jobs'));if(!r.ok)throw new Error('History unavailable');const d=await r.json();box.innerHTML='';if(!d.jobs.length){box.textContent='No saved jobs yet.';return}d.jobs.forEach(j=>{const item=document.createElement('div');item.style.cssText='border-top:1px solid #39445a;padding:12px 0';const p=document.createElement('p');p.textContent=j.prompt;const meta=document.createElement('small');meta.textContent=j.status+' · '+j.created_at;item.append(p,meta);if(j.status==='completed'){const a=document.createElement('a');a.href=url(j.download_url);a.textContent='Download MP4';a.download='cineforge-'+j.job_id+'.mp4';item.append(a)}if(j.status==='failed'&&j.error){const err=document.createElement('small');err.textContent=' · '+j.error;item.append(err)}box.append(item)})}catch(e){box.textContent=e.message}}document.getElementById('historyRefresh').onclick=loadHistory;loadHistory();
btn.onclick=async()=>{btn.disabled=true;video.hidden=true;download.hidden=true;progress.hidden=false;progress.value=5;statusEl.textContent='Submitting job…';try{
const r=await fetch(url('/jobs'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:document.getElementById('prompt').value,frames:Number(document.getElementById('frames').value),steps:Number(document.getElementById('steps').value)})});if(!r.ok)throw new Error((await r.text()).slice(0,500));const j=await r.json();statusEl.textContent='Job '+j.job_id+' queued';let done=false;
while(!done){await new Promise(resolve=>setTimeout(resolve,4000));const s=await fetch(url('/jobs/'+j.job_id));const d=await s.json();statusEl.textContent='Job status: '+d.status;if(d.status==='completed'){video.src=url(d.download_url);video.hidden=false;download.href=url(d.download_url);download.hidden=false;progress.value=100;done=true}else if(d.status==='failed'){throw new Error(d.error||'Generation failed')}else{progress.value=Math.min(progress.value+4,90)}}
}catch(e){statusEl.textContent='Error: '+e.message;progress.hidden=true}finally{await check();loadHistory()}}
</script></body></html>
